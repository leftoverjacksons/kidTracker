name: Nightly backup

# Dumps the database every night, encrypts it with BACKUP_PASSPHRASE, and keeps
# it as a workflow artifact for 90 days. The daily connection also counts as
# activity, which keeps the free Supabase project from pausing.
# Needs repository secrets SUPABASE_DB_URL and BACKUP_PASSPHRASE (SETUP.md §6).

on:
  schedule:
    - cron: '17 9 * * *'   # 09:17 UTC daily
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Set SUPABASE_DB_URL and BACKUP_PASSPHRASE repository secrets (see SETUP.md)."
            exit 1
          fi
      - name: Dump database
        run: |
          # pg_dump must be at least the server's major version; the postgres:17 image covers Supabase's.
          docker run --rm -e URL="$SUPABASE_DB_URL" postgres:17 \
            sh -c 'pg_dump "$URL" --schema=public --no-owner --no-privileges' > kidtracker.sql
          test -s kidtracker.sql
          grep -q 'CREATE TABLE public.events' kidtracker.sql
          echo "Dump size: $(wc -c < kidtracker.sql) bytes"
      - name: Encrypt
        run: |
          stamp=$(date -u +%Y-%m-%d)
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o "kidtracker-$stamp.sql.gpg" kidtracker.sql
          rm kidtracker.sql
      - uses: actions/upload-artifact@v4
        with:
          name: backup-${{ env.STAMP }}
          path: kidtracker-*.sql.gpg
          retention-days: 90
